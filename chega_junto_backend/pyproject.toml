[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chega-junto-backend"
version = "0.1.0"
description = "Infraestrutura V3 do Chega Junto — FastAPI e MySQL"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "PyMySQL[rsa]>=1.1.1,<2",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "tzdata>=2025.1",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.10,<3",
  "openai>=2,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
