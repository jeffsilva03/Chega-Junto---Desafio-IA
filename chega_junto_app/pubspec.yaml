name: chega_junto_app
description: MVP local de preparação para consultas e exames do Chega Junto.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  flutter_tts: ^4.2.5
  cupertino_icons: 1.0.9
  http: 1.6.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
